<!DOCTYPE html>

    <link rel="stylesheet" href="trabajo2.css">

<body>
    <div class="container">
        <h2>Formulario Registro</h2>
        <form>
            <input type="text" placeholder="Ingrese su Nombre" required>
            <input type="text" placeholder="Ingrese su Apellido" required>
            <span class="icon">&#9993;</span>
            <input type="email" placeholder="Ingrese su Email" required>
            <input type="password" placeholder="Ingrese su Contraseña" required>
            <span>&#128275</span>
            <input type="password" placeholder="confirmar su contraseña" required>
            
            <label>
                <input type="checkbox" required> De acuerdo con Terminos y Condiciones
            </label>
            <button type="submit">Registrar</button>
            <a href="mi.cuenta.html">¿Ya tengo una Cuenta?</a>
        </form>
    </div>
</body>
