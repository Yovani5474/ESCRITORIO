<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción a Ofertas - PC Store</title>
    <link rel="stylesheet" href="libro.css">
</head>
<body>
    <div class="form-container">
        <h2>Suscríbete a nuestra pagina y obten grandes beneficios</h2>
        <p>Recibe las últimas ofertas y novedades en computadoras y accesorios directamente en tu correo.</p>
        <form id="subscribeForm">
            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" required placeholder="Ingrese su nombre">
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="Ingrese su correo electrónico">
            </div>
            <div class="form-group">
                <label for="email">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="Ingrese su contraseña">
            </div>
            <button type="submit">Suscribirse</button>
        </form>
        <p id="responseMessage"></p>
    </div>
    <script src="js/libro.js"></script>
</body>
</html>
