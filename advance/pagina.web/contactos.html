<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creadores Oficiales</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Estilos para el modal */
        .modal {
            display: none; /* Oculto por defecto */
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Fondo oscuro semi-transparente */
        }
        
        /* Contenido del modal */
        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        /* Botón de cerrar */
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        /* Estilos del contenido */
        .creator-info {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .creator-info i {
            color: #25D366;
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <!-- Botón para abrir el modal -->
    <button id="openModalBtn">Mostrar Creadores Oficiales</button>

    <!-- Modal -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Creadores Oficiales</h2>
            <div id="creadores"></div>
        </div>
    </div>

    <script>
        // Datos de los creadores
        const creadores = [
            { nombre: "Raul A. Retamozo Paco", numero: "927407873" },
            { nombre: "Ramos Alanya, Abel Saul", numero: "948953966" }
        ];

        // Selecciona el contenedor del modal y del contenido
        const modal = document.getElementById('myModal');
        const contenedor = document.getElementById('creadores');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.querySelector('.close');

        // Función para abrir el modal
        openModalBtn.onclick = function() {
            modal.style.display = "block";
        };

        // Función para cerrar el modal
        closeModalBtn.onclick = function() {
            modal.style.display = "none";
        };

        // Cierra el modal al hacer clic fuera de él
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        };

        // Añade la información de los creadores al modal
        creadores.forEach(creador => {
            const entrada = document.createElement('div');
            entrada.className = 'creator-info';

            const nombre = document.createElement('span');
            nombre.textContent = creador.nombre;
            nombre.style.marginRight = '10px';

            const iconoWhatsApp = document.createElement('i');
            iconoWhatsApp.className = 'fab fa-whatsapp';

            const numero = document.createElement('span');
            numero.textContent = creador.numero;

            entrada.appendChild(nombre);
            entrada.appendChild(iconoWhatsApp);
            entrada.appendChild(numero);

            contenedor.appendChild(entrada);
        });
    </script>
</body>
</html>
