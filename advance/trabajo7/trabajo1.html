<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Form</title>
    <link rel="stylesheet" href="trabajo1.css">
    
</head>
<body>
    <div class="container">
        <form class="form">
            <h1>Registration Form</h1>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="numero" placeholder="email" required>
            
            <label for="numero">edad:</label>
            <input type="number" id="numero" name="numero" placeholder="Ingrese tu edad" required>
            
            <label for="contraseña">mensaje:</label>
            <input type="mensaje" id="mensaje" name="mensaje" placeholder="Ingrese el mensaje">
    
            <button type="submit">suscribete</button>
            
        </form>
    </div>
</body>
</html>
